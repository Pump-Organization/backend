version: '3.8'

services:
  pump_backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      pump-db-host:
        condition: service_healthy
    volumes:
      - .:/app   # Mount the current directory to /app in the container
    restart: always   # Restart the container if it exits

  pump-db-host:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pump_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d pump_db -U ${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  adminer:
    image: adminer
    ports:
      - "8080:8080"  