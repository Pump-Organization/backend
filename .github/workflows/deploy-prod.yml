# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Deploy to production

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '21.7.2'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11.4"
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Add Python to PATH
      run: echo "/opt/hostedtoolcache/Python/3.11.10/x64/bin" >> $GITHUB_PATH
    - name: Install serverless and dependencies
      run: |
        npm install -g serverless@3.38.0
        npm install
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2
    - name: serverless deploy
      run: serverless deploy --stage production
      env:
        SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY_PROD }}
        POSTGRES_HOST: ${{ secrets.POSTGRES_HOST_PROD }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER_PROD }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
        POSTGRES_DB: ${{ vars.POSTGRES_DB_PROD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
        FORGOT_PASSWORD_SECRET: ${{ secrets.FORGOT_PASSWORD_SECRET_PROD }}
        ENVIRONMENT: production
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
