# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Deploy to dev

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '21.7.2'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Add Python to PATH
      run: echo "/opt/hostedtoolcache/Python/3.11.10/x64/bin" >> $GITHUB_PATH
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        aws-region: us-west-1
    - name: Install serverless and dependencies
      run: |
        npm install
        npm install -g serverless
    - name: Serverless Deploy
      uses: dhollerbach/actions.serverless-with-python-requirements@v2
      env:
        SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        STAGE: DEV
        POSTGRES_HOST: ${{ secrets.POSTGRES_HOST_DEV }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER_DEV }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_DEV }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB_DEV }}
        JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
        FORGOT_PASSWORD_SECRET: ${{ secrets.FORGOT_PASSWORD_SECRET_DEV }}
        FLASK_ENV: development
