# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: maxsicherman
service: pump-api

frameworkVersion: '3'

custom:
  wsgi:
    app: app.app
  pythonRequirements:
    pythonBin: python3
    dockerizePip: true
  apiGatewayThrottling:
    maxRequestsPerSecond: 50
    maxConcurrentRequests: 25

provider:
  name: aws
  runtime: python3.11
  region: us-west-1
  environment:
    POSTGRES_HOST: ${env:POSTGRES_HOST}
    POSTGRES_USER: ${env:POSTGRES_USER}
    POSTGRES_PASSWORD: ${env:POSTGRES_PASSWORD}
    POSTGRES_DB: ${env:POSTGRES_DB}
    JWT_SECRET: ${env:JWT_SECRET}
    FORGOT_PASSWORD_SECRET: ${env:FORGOT_PASSWORD_SECRET}
    FLASK_ENV: ${env:ENVIRONMENT}
    ENVIRONMENT: ${env:ENVIRONMENT}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ses:SendEmail
      Resource: arn:aws:ses:${aws:region}:${aws:accountId}:*
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
      Resource: arn:aws:s3:::pump-media-${env:ENVIRONMENT}/*
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/pump-notification-table-${env:ENVIRONMENT}
    - Effect: Allow
      Action:
        - events:PutEvents
      Resource: arn:aws:events:${aws:region}:${aws:accountId}:event-bus/pump-event-bus-${env:ENVIRONMENT}

functions:
  pump-api:
    handler: wsgi_handler.handler
    events:
      - httpApi: '*'
  pump-event-listener:
    handler: event_listener.event_listener
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${aws:accountId}:pump-notification-queue-${env:ENVIRONMENT}

plugins:
  - serverless-wsgi
  - serverless-python-requirements
  - serverless-api-gateway-throttling
